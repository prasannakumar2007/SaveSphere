<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — MoneyMint</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #F5F0E8;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: #4A4A44;
    }
    .card {
      background: #fff;
      border-radius: 1.5rem;
      box-shadow: 0 20px 48px rgba(46,107,94,0.12);
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      border: 1px solid #E8E2D6;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #FEF9EC;
      color: #C47B1B;
      border: 1px solid rgba(196,123,27,0.2);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 1.5rem;
    }
    h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 2rem; font-weight: 800; color: #1A1A18; margin-bottom: 0.75rem; }
    h1 span { color: #2E6B5E; }
    p { font-size: 0.9375rem; line-height: 1.65; color: #7A7A72; margin-bottom: 2rem; }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      background: #2E6B5E;
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      transition: background 0.2s;
    }
    .back-btn:hover { background: #1E4F45; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Placeholder Page
    </div>
    <h1><span>Create Account</span><br/>page coming soon</h1>
    <p>
      The Registration / Sign Up page will be built in the next phase.
      For now, use the demo credentials on the Login page.<br />
      <strong style="color:#2E6B5E;">demo@moneymint.in / demo1234</strong>
    </p>
    <a href="../index.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Sign In
    </a>
  </div>
</body>
</html>
