<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Create Account — MoneyMint</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #F5F0E8;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: #4A4A44;
    }

    .card {
      background: #fff;
      border-radius: 1.5rem;
      box-shadow: 0 20px 48px rgba(46,107,94,0.12);
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      border: 1px solid #E8E2D6;
    }

    .logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .logo h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: #2E6B5E;
    }

    .subtitle {
      text-align: center;
      color: #7A7A72;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #3F403A;
      margin-bottom: 0.45rem;
    }

    input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid #D8D3C8;
      border-radius: 0.75rem;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #2E6B5E;
      box-shadow: 0 0 0 3px rgba(46,107,94,0.1);
    }

    .submit-btn {
      width: 100%;
      padding: 0.9rem;
      background: #2E6B5E;
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #1E4F45;
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.65rem;
      font-size: 0.875rem;
      text-align: center;
    }

    .message.success {
      display: block;
      background: #EAF7F1;
      color: #21604F;
      border: 1px solid #BFE3D4;
    }

    .message.error {
      display: block;
      background: #FFF1F0;
      color: #B42318;
      border: 1px solid #F2C7C3;
    }

    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #7A7A72;
    }

    .login-link a {
      color: #2E6B5E;
      font-weight: 600;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      <h1>MoneyMint</h1>
    </div>

    <p class="subtitle">
      Create your account to get started
    </p>

    <div id="message" class="message"></div>

    <form id="register-form">

      <div class="form-group">
        <label for="full-name">Full Name</label>
        <input
          type="text"
          id="full-name"
          name="full_name"
          placeholder="Enter your full name"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input
          type="tel"
          id="mobile"
          name="mobile"
          placeholder="Enter your mobile number"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a password"
          required
        />
      </div>

      <button type="submit" class="submit-btn" id="register-btn">
        Create Account
      </button>

    </form>

    <div class="login-link">
      Already have an account?
      <a href="../index.html">Sign In</a>
    </div>

  </div>

  <script>
    const registerForm = document.getElementById("register-form");
    const message = document.getElementById("message");
    const registerBtn = document.getElementById("register-btn");

    registerForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      message.className = "message";
      message.textContent = "";

      const full_name = document.getElementById("full-name").value.trim();
      const email = document.getElementById("email").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const password = document.getElementById("password").value;

      registerBtn.disabled = true;
      registerBtn.textContent = "Creating Account...";

      try {

        const response = await fetch("http://localhost:5000/api/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            full_name,
            email,
            mobile,
            password
          })
        });

        const data = await response.json();

        if (response.ok) {

          message.className = "message success";
          message.textContent = data.message;

          registerForm.reset();

        } else {

          message.className = "message error";
          message.textContent = data.message || "Registration failed.";

        }

      } catch (error) {

        console.error("Registration error:", error);

        message.className = "message error";
        message.textContent =
          "Unable to connect to the server. Make sure the backend is running.";

      } finally {

        registerBtn.disabled = false;
        registerBtn.textContent = "Create Account";

      }

    });
  </script>

</body>
</html>
